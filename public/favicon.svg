<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Zoo brand mark: three-circle RGB additive Venn. Same motif as
       zoo-logo.svg but scaled to fill the favicon viewport so the colors
       remain readable at 16x16 / 32x32. -->
  <defs>
    <clipPath id="favClip">
      <circle cx="512" cy="511" r="500"/>
    </clipPath>
    <clipPath id="favGreen">
      <circle cx="512" cy="250" r="430"/>
    </clipPath>
    <clipPath id="favRed">
      <circle cx="240" cy="670" r="430"/>
    </clipPath>
    <clipPath id="favBlue">
      <circle cx="784" cy="670" r="430"/>
    </clipPath>
  </defs>
  <g clip-path="url(#favClip)">
    <circle cx="512" cy="250" r="430" fill="#00A652"/>
    <circle cx="240" cy="670" r="430" fill="#ED1C24"/>
    <circle cx="784" cy="670" r="430" fill="#2E3192"/>
    <g clip-path="url(#favGreen)">
      <circle cx="240" cy="670" r="430" fill="#FCF006"/>
    </g>
    <g clip-path="url(#favGreen)">
      <circle cx="784" cy="670" r="430" fill="#01ACF1"/>
    </g>
    <g clip-path="url(#favRed)">
      <circle cx="784" cy="670" r="430" fill="#EA018E"/>
    </g>
    <g clip-path="url(#favGreen)">
      <g clip-path="url(#favRed)">
        <circle cx="784" cy="670" r="430" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>

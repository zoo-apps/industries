# Hanzo CI/CD for zoo-apps/industries: .github/workflows/cicd.yml imports hanzoai/ci,
# which reads this file. The build door builds each image, one BuildKit Job
# per platform.
images:
  - name: zoo-industries
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/zooai/zoo-industries
    platforms: [linux/amd64]

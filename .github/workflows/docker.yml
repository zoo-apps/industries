name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker:
    uses: zooai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/zooai/zoo-industries
      runner-amd64: zoo-build-linux-amd64
      runner-arm64: zoo-build-linux-amd64
      runner-deploy: zoo-build-linux-amd64
      platforms: "linux/amd64"
      # Deployment lives on do-sfo3-lux-k8s (namespace: zoo-mainnet, container: spa)
      # behind the hanzo-ingress DaemonSet. CF DNS points zoo.industries +
      # www.zoo.industries at 134.199.138.27. No zoo-deploy-* runner scale-set
      # exists yet under the zooai org — until one is provisioned with a
      # kubeconfig for lux-k8s, the deploy step would hang queued.
      # Build + push only here; roll the deployment with:
      #   kubectl --context=do-sfo3-lux-k8s -n zoo-mainnet \
      #     set image deploy/zoo-industries spa=ghcr.io/zooai/zoo-industries:<tag>
      deploy: false
      deploy-namespace: zoo-mainnet
      deploy-deployment: zoo-industries
    secrets: inherit

name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker:
    uses: zooai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/zooai/zoo-industries
      runner-amd64: evo
      runner-arm64: zoo-build-linux-amd64
      runner-deploy: evo
      platforms: "linux/amd64"
      # The deployment lives on do-sfo3-lux-k8s/zoo-mainnet, behind the
      # hanzo-ingress DaemonSet (CF DNS → 134.199.138.27). The
      # zoo-deploy-linux-amd64 runner mounts a kubeconfig that targets
      # the zoo-deploy SA on lux-k8s with namespace-scoped Role.
      deploy: true
      deploy-namespace: zoo-mainnet
      deploy-deployment: zoo-industries
      deploy-container: spa
    secrets: inherit

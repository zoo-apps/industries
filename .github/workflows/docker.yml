name: Docker
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  docker:
    uses: zooai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/zooai/zoo-industries
      runner-amd64: zoo-build-linux-amd64
      runner-arm64: zoo-build-linux-amd64
      runner-deploy: zoo-deploy-linux-amd64
      platforms: "linux/amd64"
      # Deployment lives on do-sfo3-lux-k8s namespace=zoo-mainnet container=spa
      # behind the hanzo-ingress DaemonSet. CF DNS points zoo.industries +
      # www.zoo.industries at 134.199.138.27.
      # The zoo-deploy-linux-amd64 runner scale-set runs on do-sfo3-hanzo-k8s
      # with a mounted kubeconfig (zoo-deploy SA, namespace-scoped Role on
      # lux-k8s/zoo-mainnet). Deploy fires on tag push via the shared
      # workflow's (tag-single-arch || create-manifest) gate.
      deploy: true
      deploy-namespace: zoo-mainnet
      deploy-deployment: zoo-industries
    secrets: inherit
